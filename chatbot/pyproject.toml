[project]
name = "heronsguide"
version = "0.1.0"
description = "HeronsGuide grounded chatbot: answers only from UMak source documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heronsguide"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
